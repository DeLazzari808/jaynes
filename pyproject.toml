[project]
name = "jaynes-ai"
version = "0.0.1"
description = "AI agents earn autonomy: they act without human approval only where their measured error rate is provably within your risk budget."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pygments>=2.17",
]

[project.scripts]
jaynes = "jaynes.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "scipy>=1.14",
    "pyright>=1.1.400",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaynes"]

[tool.hatch.build.targets.wheel.force-include]
"packages" = "jaynes/_packages"  # the packages of roles that come with Jaynes; the engine never imports them

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n 8"  # 8 tests at a time: the suite takes 3 minutes instead of 12; -n 0 runs one at a time

[tool.pyright]
include = ["src", "tests", "packages"]
extraPaths = ["src", "packages"]  # tests import a package's roles as software.build_feature
typeCheckingMode = "strict"
pythonVersion = "3.12"
